name: Merge sweep

# Re-drive green PRs that the merge queue evicted, so an eviction is never terminal. auto-merge.yml
# enqueues a green PR once per triggering event (a push, a /review comment, or a fresh pr-build); if the
# merge queue then evicts it — a merge group that could not form, or a rebuild against a moved main that
# failed — nothing re-drives an otherwise-idle green PR and it strands: green on every rubric, never
# merged. housekeeping.yml only CLOSES PRs (and only blocking ones), so a wedged-but-green PR is closed
# by nothing. This scheduled sweep re-enqueues such PRs (reusing the existing head-pinned review — no
# re-review, no API spend), and for a head the queue has repeatedly rejected, updates the branch onto
# main or flags a conflict. It calls the lightweight TauCetiReview merge-sweep workflow, which mints no
# provider keys and runs no reviewer; the merge decision is the same one auto-merge uses, so the sweep
# can never merge something the normal gate would refuse.
#
# It skips a pass entirely while the daily mathlib bump occupies a merge-queue entry. The sweep is the
# other door into the queue, so leaving it open would defeat the head-of-line reservation auto-merge.yml
# honours: an ordinary PR re-enqueued here would either land underneath the bump's 85-minute rebuild or
# be batched into its merge group. A skipped pass costs at most an hour of latency for everything else,
# the reservation expires on its own, and the next hourly pass re-drives whatever was waiting. See
# scripts/bump_lock.py.

on:
  schedule:
    - cron: "40 * * * *"   # hourly, offset from housekeeping (:20) and the daily bump
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List actions without enqueuing / updating / flagging"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read     # read the merge queue for the bump reservation

concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  bump-lock:
    runs-on: ubuntu-latest
    outputs:
      held: ${{ steps.lock.outputs.held }}
    steps:
      # See auto-merge.yml: a checkout failure must report the queue free, not skip the
      # sweep. The lock step below handles the resulting missing script.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          out=$(python3 scripts/bump_lock.py) \
            || out=$'held=false\nreason=bump_lock.py did not run; failing open'
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  sweep:
    needs: bump-lock
    if: ${{ needs.bump-lock.outputs.held != 'true' }}
    # Pinned to a TauCetiReview commit; bump deliberately. The reusable workflow receives the App
    # secrets, so a floating @main would be a supply-chain risk.
    uses: TauCetiProject/TauCetiReview/.github/workflows/merge-sweep.yml@eeed9637d7e2af319a04de8120b35f0c52318f0d
    with:
      dry_run: ${{ inputs.dry-run || false }}
      review_ref: eeed9637d7e2af319a04de8120b35f0c52318f0d
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
