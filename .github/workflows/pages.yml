name: Pages

# Build the Verso website in web/ and deploy it to GitHub Pages.
#
# The site project (web/) depends only on Verso. The type-checked theorem snippets are
# extracted by SubVerso from web/examples/ — a separate project that imports the real
# TauCeti library (and hence Mathlib) — so the showcased mathematics is elaborated at
# build time and cannot drift. The examples project is built first; its Mathlib oleans
# come from the cache, not a from-scratch rebuild.
#
# The API reference under /docs is generated by doc-gen4 from the nested docbuild/ project
# (which requires the real TauCeti library and shares the parent's Mathlib pin). With
# interproject linking (DOCGEN_LOCAL_MODULE_ROOTS / DOCGEN_DEPS_DOCS_URL, see the doc build
# step) doc-gen4 renders pages for only the TauCeti.* modules and links references to Mathlib
# out to the hosted mathlib4_docs, so the output is small (tens of MB, not the whole rendered
# closure). It is normally rebuilt every three hours — on the schedule below, plus the first
# run that finds no cached docs — and cached under a run-specific key. A push that touches
# only web/ (or the chart scripts) reuses the cached docs, since the mathematics has not
# changed, so those site deploys stay fast.
#
# The Statistics page's "lines of code by date" charts are regenerated here, at deploy
# time, straight from git history (see scripts/loc_graph.py) — they are not committed
# state. The per-roadmap chart (scripts/loc_roadmap_graph.py) is regenerated the same
# way, but from the PR labels rather than git, since roadmap attribution lives in the
# `roadmap/<Area>` labels; it reads them via gh (hence pull-requests: read below). The
# participation snapshot likewise reads GitHub through gh, but deduplicates the current
# human actors instead of reconstructing a historical series. The three-hour `schedule` below
# redeploys the site so the charts track the project as it grows.
# (This replaces the old loc-graph workflow, which committed the SVGs to main on a
# schedule; main now sits behind a merge queue that refuses direct pushes, so generating
# the charts in this build is the only way they refresh.)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docbuild/**'
      - 'scripts/loc_graph.py'
      - 'scripts/loc_roadmap_graph.py'
      - 'scripts/participant_graph.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: "23 */3 * * *"   # Every three hours (UTC): refresh the charts and API docs
  workflow_dispatch:

permissions:
  # These scopes govern this repository. Reads from the other three repositories
  # rely on their public visibility.
  contents: read
  pages: write
  id-token: write
  issues: read      # issue participants in this repository
  pull-requests: read # roadmap labels and PR participants

concurrency:
  group: pages
  # Let an active deployment finish before a newly triggered run starts.
  cancel-in-progress: false

env:
  # Run JavaScript actions on Node 24 (Node 20 is deprecated on GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Named `build-site`, not `build`, to keep every job name distinct from the required `build` commit
  # status context (see pr-build.yml's header note on that collision). This workflow only runs on
  # push-to-main / schedule, never on a PR, so its check-run can't wedge a PR today — the distinct name
  # is hygiene so a future PR trigger here could never reintroduce the collision.
  build-site:
    runs-on: ubuntu-latest
    outputs:
      docs-rebuilt: ${{ steps.docs-plan.outputs.build }}
      # The commit the /docs actually being deployed were generated from, read from the tree itself.
      docs-source-sha: ${{ steps.fold.outputs.docs-source-sha }}
    defaults:
      run:
        working-directory: web
    steps:
      # Full history: scripts/loc_graph.py reconstructs the whole "lines by date"
      # series by walking every commit, so a shallow checkout would truncate the charts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the roadmap repository (full history, for its chart)
        working-directory: ${{ github.workspace }}
        run: git clone --quiet https://github.com/TauCetiProject/TauCetiRoadmap.git /tmp/roadmap

      # Overwrites the checked-in SVGs in the runner only (never committed back). The
      # versions tracked in web/static_files/ are just fallback snapshots so a local
      # `cd web && lake exe web` renders something; refresh them by running these same
      # two commands. The deployed charts always come from this step, not from the repo.
      - name: Regenerate the lines-of-code charts into static_files
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/loc_graph.py \
            --repo . --ref HEAD \
            --title "Tau Ceti — lines of Lean" --accent "#ff9d4d" \
            --out web/static_files/loc-tauceti.svg \
            TauCeti TauCeti.lean
          python3 scripts/loc_graph.py \
            --repo /tmp/roadmap --ref HEAD \
            --title "Tau Ceti Roadmap — lines written" --accent "#5eead4" \
            --out web/static_files/loc-roadmap.svg \
            TauCetiRoadmap TauCetiRoadmap.lean

      # The per-roadmap chart is built from the PR labels (roadmap attribution is not in
      # git), so it queries gh rather than walking commits. A gh failure here must not sink
      # the whole deploy — the committed fallback SVG stays in place if the query fails.
      - name: Regenerate the per-roadmap chart into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/loc_roadmap_graph.py \
            --repo "${{ github.repository }}" \
            --title "Tau Ceti — lines of Lean per roadmap" \
            --out web/static_files/loc-per-roadmap.svg \
          || echo "::warning::per-roadmap chart generation failed; keeping the committed fallback SVG"

      # A current snapshot rather than a historical series: participants are deduplicated
      # across PRs, issues, comments/reviews, and default-branch commits in all four repos.
      # This API scan runs only in the scheduled/deploy build, never at request time.
      - name: Regenerate the participation snapshot into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/participant_graph.py \
            --out web/static_files/participation.svg \
          || echo "::warning::participation graph generation failed; keeping the committed fallback SVG"

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # --- API documentation (doc-gen4), normally built every three hours ----------------
      # The doc build is the heavy part of this job, and the mathematics only changes on
      # pushes to TauCeti/ (never on the web/-only pushes that trigger this workflow), so the
      # generated HTML is cached under a run-specific key and reused on web-only runs.

      # Restore-only avoids the automatic post-job re-upload that plain actions/cache does
      # on runs that merely reused the docs. The save below runs only after an actual rebuild.
      - name: Restore the generated API docs
        id: docs-cache
        uses: actions/cache/restore@v4
        with:
          path: docbuild/.lake/build/doc
          key: docs-html-v2-${{ hashFiles('lean-toolchain', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            docs-html-v2-${{ hashFiles('lean-toolchain', 'docbuild/lake-manifest.json') }}-

      # Rebuild on the three-hour schedule / manual dispatch, or whenever no cached docs exist at
      # all (e.g. the first run after this workflow lands) so /docs is never missing for long.
      - name: Decide whether to (re)build the API docs
        id: docs-plan
        env:
          EVENT: ${{ github.event_name }}
          MATCHED: ${{ steps.docs-cache.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ -z "$MATCHED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Mathlib oleans (docs project)
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        run: lake exe cache get

      # doc-gen4 documents a library's root modules and their closure; TauCeti's root is empty
      # by design, so we regenerate a throwaway aggregator root that imports the whole glob.
      - name: Generate the docs aggregator root
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        run: python3 mk_docs_root.py

      # Render pages for only the TauCeti.* modules; references to Mathlib (and Lean core) link
      # out to the hosted mathlib4_docs via its /find resolver. Start from a clean doc tree so
      # pages for deleted modules do not linger (this step never runs on the web-only reuse
      # path, which keeps the restored cache).
      - name: Build the API documentation (doc-gen4)
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        env:
          DOCGEN_LOCAL_MODULE_ROOTS: TauCeti
          DOCGEN_DEPS_DOCS_URL: https://leanprover-community.github.io/mathlib4_docs
        run: |
          rm -rf .lake/build/doc .lake/build/doc-data
          lake build TauCetiDocs:docs

      # Stamp the tree with the commit it was generated from, BEFORE it is cached, so the
      # provenance travels with the tree wherever it is later restored. This is what makes the
      # `docgen` branch trustworthy: the branch follows the marker of the tree that was actually
      # deployed, rather than `github.sha` of whichever run happened to deploy it.
      - name: Record the commit the API docs were generated from
        if: steps.docs-plan.outputs.build == 'true'
        run: printf '%s\n' "${{ github.sha }}" > docbuild/.lake/build/doc/SOURCE_SHA

      - name: Save the generated API docs
        if: steps.docs-plan.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build/doc
          key: docs-html-v2-${{ hashFiles('lean-toolchain', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}

      - name: Cache Lake builds (site + examples)
        uses: actions/cache@v4
        with:
          path: |
            web/.lake
            web/examples/.lake
          key: web-lake-${{ runner.os }}-${{ hashFiles('web/lake-manifest.json', 'web/lean-toolchain', 'web/examples/lake-manifest.json', 'web/examples/lean-toolchain') }}
          restore-keys: web-lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans (examples project)
        working-directory: web/examples
        run: lake exe cache get

      - name: Build examples project (checks the showcased TauCeti theorems)
        working-directory: web/examples
        run: lake build

      - name: Build site (extracts the checked snippets, compiles Verso)
        run: lake build

      - name: Generate static site
        run: lake exe web --output _out

      # Place the doc-gen4 output (fresh from this run, or restored from the latest cache) at
      # /docs inside the site artifact. deploy-pages replaces the whole site each time, so the
      # docs must ride along in every deploy — hence the cache that keeps them available on
      # runs that did not rebuild them.
      # A missing doc tree is only tolerable when this run did not intend to rebuild one. When it
      # DID, deploying anyway would break the invariant the `docgen` branch carries: `docs-rebuilt`
      # is `docs-plan.outputs.build`, which records the *intention* to rebuild, and it is what
      # `advance-docgen-ref` keys on. So a run that planned a rebuild, produced no docs, and
      # deployed without them would still advance `docgen` — asserting that documentation is live
      # for a commit whose documentation was never published, which is exactly what the branch
      # exists to rule out.
      # A missing doc tree is ALWAYS fatal here, whether or not this run planned a rebuild.
      #
      # A Pages deployment replaces the whole site, so deploying without `/docs` deletes the live
      # documentation — which breaks the `docgen` invariant even though no ref moves. The decision is
      # made from the filesystem rather than from `cache-matched-key`, because that key reports what
      # the cache *claimed*, not what was restored. There is no legitimate path here with no tree: a
      # genuine cache miss sets `build=true` (see `docs-plan`) and the docs are built, so an absent
      # tree means either that build produced nothing or a hit restored nothing, and both deserve to
      # stop the deploy.
      - name: Fold the API docs into the site under /docs
        id: fold
        run: |
          if [ ! -d ../docbuild/.lake/build/doc ]; then
            echo "::error title=API docs missing::no doc tree to deploy; refusing to publish a site without /docs, which would delete the live documentation"
            exit 1
          fi
          rm -rf _out/docs
          cp -a ../docbuild/.lake/build/doc _out/docs
          if [ ! -s _out/docs/index.html ]; then
            echo "::error title=API docs are empty::the doc tree has no index.html, so /docs would deploy unusable"
            exit 1
          fi
          # The marker rides inside the tree, so it is there whether the docs were just built or
          # restored from cache. An unmarked tree is FATAL rather than a warning: deploying one would
          # replace the live documentation with something whose provenance is unknown, leaving the
          # branch naming a commit that is no longer published and no way to notice. The cache key
          # namespace was bumped alongside this, so no pre-existing cache can supply one; a miss
          # therefore rebuilds and stamps.
          if [ ! -s _out/docs/SOURCE_SHA ]; then
            echo "::error title=API docs have no provenance::the doc tree carries no SOURCE_SHA, so the commit it documents is unknown; refusing to deploy it"
            exit 1
          fi
          sha=$(tr -d "[:space:]" < _out/docs/SOURCE_SHA)
          # Matched exactly. A prefix test such as `[0-9a-f]*` accepts one hex character followed by
          # anything at all, which is not validation.
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=API docs have a malformed SOURCE_SHA::got '${sha}', which is not a 40-character commit sha"
            exit 1
          fi
          echo "docs-source-sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'deploying /docs generated from %s\n' "$sha"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/_out

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A moving source ref for consumers that need to stay in lockstep with the published API
  # documentation. Advance it only after this run freshly rebuilt the docs and successfully
  # deployed them. Cached site-only deploys must leave it alone: their docs belong to the
  # earlier commit already named by this ref.
  # Point `docgen` at the commit whose documentation is now live.
  #
  # The candidate is the marker carried inside the deployed doc tree, NOT `github.sha`. Those differ
  # whenever a deploy reuses cached documentation, which is the normal path for a `web/`-only push --
  # and taking `github.sha` there would assert that documentation exists for a commit that was never
  # documented. It also makes the branch self-healing: every successful deploy re-points it at what
  # is actually published, so a branch that has drifted corrects itself on the next deploy rather
  # than staying wrong until someone notices.
  #
  # It no longer keys on `docs-rebuilt` either. That output records the *intention* to rebuild,
  # decided before anything is built; the marker records the outcome, which is the question the
  # branch is actually answering.
  advance-docgen-ref:
    needs: [build-site, deploy]
    if: needs.build-site.outputs.docs-source-sha != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the docgen branch at the documented commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.build-site.outputs.docs-source-sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          endpoint="repos/$REPO/git/refs/heads/docgen"
          current=$(gh api "repos/$REPO/git/matching-refs/heads/docgen" \
            --jq '.[] | select(.ref == "refs/heads/docgen") | .object.sha')

          if [ -n "$current" ]; then
            if [ "$current" = "$CANDIDATE" ]; then
              echo "docgen already points to $CANDIDATE"
              exit 0
            fi

            # `docgen` is a POINTER TO CURRENT STATE, not an append-only history: it answers
            # "which commit's documentation is live right now". Once this run has replaced the site,
            # leaving the branch anywhere other than the deployed commit means it names documentation
            # that is no longer published — so a stale value is not a safe fallback, it is the exact
            # failure the branch exists to prevent.
            #
            # A non-fast-forward therefore has to be resolved, not ignored, which means the candidate
            # must first be shown to be a real commit on this repository's mainline. With that
            # established, moving the pointer backwards is legitimate and is how the branch recovers
            # from having been set ahead of reality.
            rel=$(gh api "repos/$REPO/compare/$CANDIDATE...$DEFAULT_BRANCH" --jq .status || echo unknown)
            case "$rel" in
              ahead|identical) ;;
              *)
                echo "::error title=documented commit is not on the mainline::$CANDIDATE compares '$rel' to $DEFAULT_BRANCH; refusing to point docgen at it"
                exit 1 ;;
            esac

            # Try the safe update first. Anything other than a non-fast-forward — auth, rate limit,
            # network, a 5xx — must fail loudly rather than be mistaken for a rewind.
            if gh api --method PATCH "$endpoint" -f sha="$CANDIDATE" -F force=false > /dev/null 2> advance.err; then
              echo "docgen advanced $current -> $CANDIDATE"
              exit 0
            fi
            if ! grep -qi "not a fast forward" advance.err; then
              echo "::error title=could not update docgen::the update failed for a reason other than a non-fast-forward"
              cat advance.err
              exit 1
            fi
            echo "::warning title=docgen rewound::$current is not an ancestor of the deployed commit; pointing docgen back to what is actually live"
            gh api --method PATCH "$endpoint" -f sha="$CANDIDATE" -F force=true > /dev/null
            echo "docgen moved $current -> $CANDIDATE"
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref='refs/heads/docgen' \
              -f sha="$CANDIDATE"
            echo "docgen created at $CANDIDATE"
          fi
