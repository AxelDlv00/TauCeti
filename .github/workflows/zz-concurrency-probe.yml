name: zz concurrency probe

# TEMPORARY. Confirms GitHub's workflow parser accepts `concurrency.queue`, which
# auto-merge.yml, merge-sweep.yml and update.yml now rely on. If the key were rejected,
# those three would fail to parse ON MAIN and merges would stop repository-wide, and
# nothing else in this PR would reveal that before merge. Deleted once it has run green.

on:
  push:
    branches: [issue-2026]

permissions: {}

concurrency:
  group: zz-concurrency-probe
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "the parser accepted concurrency.queue"
