name: Bump autofix

# Repair the daily mathlib bump instead of waiting a day for a human to type a rename.
# Bump breakage is almost always a name the new mathlib deprecates, used by code that
# landed on main after the branch was cut, and the compiler names both halves of the fix.
# #1986 lost four merge-group rebuilds waiting for exactly that substitution.
#
# WHOSE LOG WE READ IS THE SECURITY QUESTION. `workflow_run` hands this job write
# credentials even though the triggering run had none, and a build log is a process's
# stdout, not an authenticated compiler channel — anything elaborating in the sandbox can
# print a line shaped like a diagnostic. So a merge group's log, carrying other people's
# PRs, never authors an edit: a merge-group failure only merges main into the bump branch
# and pushes that, reading no log, and the bump's own build then reproduces the breakage
# one build later under a trusted trigger, where the renames are applied. Every
# invocation, dispatch included, re-reads the run from the API and checks its workflow,
# event, conclusion and head SHA before the App token is minted.
#
# The push is a proposal: the full build, audits, lint, bump-guard and review rubrics all
# still have to pass, so a wrong rename stays red as the unrenamed source did. It touches
# only the machine-owned bump branch, and gives up rather than looping — no renames, no
# diff, or MAX_AUTOFIXES repairs already on this bump — leaving the rest to the stuck-bump
# alert, the intended end state for breakage that is not a mechanical rename.

on:
  workflow_run:
    workflows: ["pr-build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "failed pr-build run id to repair from (validated like any other)"
        required: true
        type: string

permissions:
  contents: read
  actions: read           # read the failed run's metadata and log
  pull-requests: read     # find the open LKG bump PR

concurrency:
  # Shared with update.yml, which force-pushes this branch daily: otherwise a repair can
  # land on a branch about to be rewritten, or arrive just after against a stale log.
  # `queue: max` because the default cancels the pending run, which could be that update.
  group: lkg-bump-branch
  cancel-in-progress: false
  queue: max

env:
  LKG_BRANCH: hopscotch/lkg-bump   # keep in sync with update.yml's LKG_BRANCH
  # Counted over `main..HEAD`, so the budget resets when update.yml cuts the next bump and
  # never counts a repair that already merged. Three covers one round of renames plus a
  # second for deprecations only reachable once the first compiles.
  MAX_AUTOFIXES: 3

jobs:
  autofix:
    if: >
      github.repository == 'TauCetiProject/TauCeti'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pr-build fails for ordinary PRs too, so this usually decides "not mine". That is
      # decided FIRST, from the API alone: no App token, no checkout. Everything is re-read
      # from the run record, so a dispatch is held to the same standard as an automatic run.
      - name: Identify the failure and decide what may be done about it
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          stop() { echo "$1"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0; }

          case "$RUN_ID" in ''|*[!0-9]*) stop "No usable run id." ;; esac
          read -r wf_path event conclusion run_head < <(
            gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '"\(.path) \(.event) \(.conclusion) \(.head_sha)"')
          echo "run $RUN_ID: $wf_path event=$event conclusion=$conclusion head=$run_head"
          [ "$wf_path" = ".github/workflows/pr-build.yml" ] || stop "Not a pr-build run."
          [ "$conclusion" = "failure" ] || stop "That run did not fail."

          pr=$(gh api "repos/$REPO/pulls?state=open&head=TauCetiProject:$LKG_BRANCH" \
                 --jq '.[0].number // empty')
          [ -n "$pr" ] || stop "No open LKG bump PR; nothing to repair."
          read -r head head_ref < <(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.head.ref)"')
          [ "$head_ref" = "$LKG_BRANCH" ] || stop "Bump PR #$pr is not on $LKG_BRANCH."
          echo "open bump PR #$pr @ $head"

          case "$event" in
            pull_request_target)
              # Only the bump's own head build may author an edit.
              [ "$run_head" = "$head" ] || stop "That build is another PR's head, not the bump's."
              mode=rename
              ;;
            merge_group)
              # Untrusted, so confirm the bump is in the group and then only resynchronise.
              # Both pins: a toolchain-only bump leaves the manifest identical to an
              # unrelated group's. An unreadable blob fails CLOSED (the queue deletes its
              # synthetic ref once the group resolves).
              for f in lake-manifest.json lean-toolchain; do
                g=$(gh api "repos/$REPO/contents/$f?ref=$run_head" --jq '.sha' 2>/dev/null || true)
                b=$(gh api "repos/$REPO/contents/$f?ref=$head" --jq '.sha' 2>/dev/null || true)
                [ -n "$g" ] && [ -n "$b" ] || stop "Could not read $f on both sides; not acting."
                [ "$g" = "$b" ] || stop "That merge group does not carry the bump's pins."
              done
              mode=sync
              ;;
            *) stop "pr-build run on event '$event' is not something to repair from." ;;
          esac
          { echo "mode=$mode"; echo "pr=$pr"; echo "run_id=$RUN_ID"; } >> "$GITHUB_OUTPUT"
          echo "::notice::bump PR #$pr: $mode"

      - uses: actions/create-github-app-token@v1
        id: app-token
        if: steps.subject.outputs.mode != 'none'
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          # Scoped to this repository and the one permission a repair needs.
          repositories: TauCeti
          permission-contents: write

      # The fixer, kept out of the working tree so it is always main's copy.
      - uses: actions/checkout@v4
        if: steps.subject.outputs.mode != 'none'
        with:
          path: main
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check out the bump branch
        if: steps.subject.outputs.mode != 'none'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LKG_BRANCH }}
          path: work
          token: ${{ steps.app-token.outputs.token }}
          # Full history: a shallow clone has no merge base to merge main across.
          fetch-depth: 0

      - name: Stop if this bump's repair budget is spent
        id: budget
        if: steps.subject.outputs.mode != 'none'
        working-directory: work
        run: |
          set -euo pipefail
          # Only what is unique to THIS branch: squash commits keep the marker, so counting
          # all reachable history would exhaust every future bump's budget after three ever.
          git fetch origin main
          spent=$(git log -F --grep='[bump-autofix]' --oneline FETCH_HEAD..HEAD | wc -l)
          echo "repairs on this bump: $spent (cap $MAX_AUTOFIXES)"
          if [ "$spent" -ge "$MAX_AUTOFIXES" ]; then
            echo "::warning::repair budget spent for this bump; leaving it to the stuck-bump alert"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # The rename pass deliberately does NOT merge main first: a diagnostic's line and
      # column refer to the tree that was built, so merging under them would move the source
      # out from beneath the log and every edit would skip as stale. Resynchronising is the
      # merge-group path's job, and the build it triggers produces a matching log.
      - name: Bring the bump branch up to main
        id: sync
        if: steps.budget.outputs.go == 'true' && steps.subject.outputs.mode == 'sync'
        run: |
          set -euo pipefail
          # The files a merge-group failure points at are usually what landed since the
          # branch was cut. A conflict means this is not the mechanical case.
          git -C work config user.name  'tauceti-review-bot[bot]'
          git -C work config user.email '290224625+tauceti-review-bot[bot]@users.noreply.github.com'
          before=$(git -C work rev-parse HEAD)
          git -C work fetch origin main
          if ! git -C work merge --no-edit FETCH_HEAD; then
            git -C work merge --abort || true
            echo "::warning::the bump branch conflicts with main; not a mechanical fix"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$before" = "$(git -C work rev-parse HEAD)" ]; then
            echo "::notice::the bump branch is already up to date with main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the renames the bump's own build named
        id: fix
        if: steps.budget.outputs.go == 'true' && steps.subject.outputs.mode == 'rename'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.subject.outputs.run_id }}
        run: |
          set -euo pipefail
          git -C work config user.name  'tauceti-review-bot[bot]'
          git -C work config user.email '290224625+tauceti-review-bot[bot]@users.noreply.github.com'
          # --log-failed is the failing steps only; fall back if that leaves it empty.
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > build.log 2>/dev/null || true
          if [ ! -s build.log ]; then
            gh run view "$RUN_ID" --repo "$REPO" --log > build.log 2>/dev/null || true
          fi
          echo "read $(wc -l < build.log) log line(s)"
          rc=0
          python3 main/scripts/bump_autofix.py --log build.log --root work \
            --applied-files applied.txt > fix.txt || rc=$?
          cat fix.txt
          { echo "### Bump autofix"; echo; echo '```'; cat fix.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::notice::nothing mechanically fixable in this failure"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Defence in depth behind the script's containment check: if the tree moved
          # anywhere but the library, a guard failed and we touch nothing.
          if git -C work status --porcelain | grep -qvE '^ M (TauCeti/|TauCeti\.lean$)'; then
            echo "::error::unexpected working-tree change outside TauCeti/; refusing to push"
            git -C work status --porcelain
            exit 1
          fi
          # Stage exactly the files the script reports editing, never `add -A`.
          xargs -a applied.txt -d '\n' -r git -C work add --
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the repair
        if: steps.fix.outputs.changed == 'true' || steps.sync.outputs.changed == 'true'
        env:
          BUMP_PR: ${{ steps.subject.outputs.pr }}
          MODE: ${{ steps.subject.outputs.mode }}
          FIXED: ${{ steps.fix.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$FIXED" = "true" ]; then
            { echo "chore: rename the declarations the new mathlib deprecates"
              echo
              cat fix.txt
              echo
              echo "Pushed automatically for PR #$BUMP_PR by .github/workflows/bump-autofix.yml."
              echo "[bump-autofix]"
            } > "$GITHUB_WORKSPACE/msg.txt"
            git -C work commit --file "$GITHUB_WORKSPACE/msg.txt"
          fi
          git -C work push origin "HEAD:$LKG_BRANCH"
          echo "::notice::pushed a $MODE to $LKG_BRANCH for PR #$BUMP_PR"
